server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 15m
spring:
  application:
    name: sams-backend
  datasource:
    url: ${SAMS_DB_URL:jdbc:mysql://localhost:3306/sams?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${SAMS_DB_USERNAME:sams}
    password: ${SAMS_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
            required: ${SMTP_STARTTLS_REQUIRED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
sams:
  jwt:
    secret: ${SAMS_JWT_SECRET:}
    issuer: ${SAMS_JWT_ISSUER:sams}
    lifetime-minutes: 15
  cookie:
    secure: ${SAMS_COOKIE_SECURE:false}
  frontend-url: ${SAMS_FRONTEND_URL:http://localhost:5173}
  email:
    from: ${SAMS_MAIL_FROM:no-reply@sams.local}
    enabled: ${SAMS_EMAIL_ENABLED:false}
  attendance:
    default-threshold: ${SAMS_ATTENDANCE_THRESHOLD:75}
  bootstrap:
    admin-email: ${SAMS_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${SAMS_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-institution-id: ${SAMS_BOOTSTRAP_ADMIN_ID:}
    admin-name: ${SAMS_BOOTSTRAP_ADMIN_NAME:}
logging:
  level:
    root: INFO
    edu.pesu.sams: INFO
    org.springframework.security: WARN
