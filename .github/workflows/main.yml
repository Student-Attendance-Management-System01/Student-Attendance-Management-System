name: SAMS Integrated CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build, Test & JaCoCo Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and verify backend with tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload Surefire Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14

      - name: Upload JaCoCo Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jacoco-reports
          path: backend/target/site/jacoco/
          retention-days: 14

  frontend:
    name: Frontend Dependencies, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run React tests
        working-directory: frontend
        run: npm test

      - name: Build React application
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 14
